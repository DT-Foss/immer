[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immer"
version = "0.8.0"
description = "Local frontier-model runtime with causal weight addressing, grounded execution, persistent state, and exact capabilities."
requires-python = ">=3.11"
authors = [{name = "David Tom Foss"}]
readme = "README.md"
keywords = ["causal-ai", "deepseek", "mixture-of-experts", "safetensors", "local-inference"]
dependencies = [
  "numpy>=1.26",
  "requests>=2.32",
]

[project.optional-dependencies]
neural = ["torch>=2.5", "safetensors>=0.4", "tokenizers>=0.22"]
mouth = ["torch>=2.5", "transformers>=4.45"]
fertig-binary = ["msgpack>=1.0", "xxhash>=3.5"]
export = ["safetensors>=0.4"]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
immer = "immer.cli:main"

[project.urls]
Homepage = "https://davidtomfoss.com/"
Repository = "https://github.com/DT-Foss/immer"
Documentation = "https://github.com/DT-Foss/immer/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
