[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immer"
version = "0.2.0"
description = "Unified cognitive runtime for grounded cognition, persistent state, structured capabilities and causal neural routing."
requires-python = ">=3.11"
authors = [{name = "David Tom Foss"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
neural = ["torch>=2.5"]
dev = ["pytest>=8"]

[project.scripts]
immer = "immer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
