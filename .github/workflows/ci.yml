name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool manifests/components.json >/dev/null
      - name: Verify CRSA source digest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifests/components.json").read_text())
          crsa = next(item for item in manifest["components"] if item["name"] == "CRSA")
          scheme, separator, expected = crsa["revision"].partition(":")
          if separator != ":" or scheme not in {"sha256", "operator-sha256"}:
              raise SystemExit(f"Unsupported CRSA revision: {crsa['revision']}")
          actual = hashlib.sha256(Path(crsa["integration"]).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"CRSA digest mismatch: {actual} != {expected}")
          print(actual)
          PY

  neural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[neural]'
      - run: python -m unittest tests.test_crsa -v
