name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run bootstrap
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python scripts/bootstrap.py
      - name: Validate manifests
        run: |
          python -m json.tool manifests/sources.lock.json >/dev/null
          python -m json.tool manifests/modules.lock.json >/dev/null
          python -m json.tool manifests/models.lock.json >/dev/null
